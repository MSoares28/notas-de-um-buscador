<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas de um Buscador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── BARRA DE PROGRESSO ── -->
  <div class="progress-bar" id="progress-bar"></div>

  <!-- ── CAPA ── -->
  <div class="cover">
    <div class="cover__cross">✦ ✝ ✦</div>
    <h1 class="cover__title" id="cover-title"></h1>
    <h2 class="cover__subtitle" id="cover-sub"></h2>
    <div class="cover__divider"></div>
    <div class="cover__verse">
      <p id="epigrafe-texto"></p>
      <cite id="epigrafe-fonte"></cite>
    </div>
    <div class="cover__scroll">↓ &nbsp; CONTINUAR &nbsp; ↓</div>
  </div>

  <!-- ── NAVEGAÇÃO ── -->
  <nav class="nav">
    <span class="nav__brand" id="nav-brand"></span>
    <div class="nav__controls">
      <div class="font-controls">
        <button class="font-btn" id="font-down">A−</button>
        <button class="font-btn" id="font-up">A+</button>
      </div>
      <button class="nav__menu-btn" id="menu-btn">☰ Índice</button>
    </div>
  </nav>

  <!-- ── ÍNDICE ── -->
  <div class="toc-overlay" id="toc-overlay"></div>
  <aside class="toc" id="toc">
    <div class="toc__header">
      <span class="label">ÍNDICE</span>
      <button class="toc__close" id="toc-close">✕</button>
    </div>
    <nav class="toc__nav" id="toc-nav"></nav>
  </aside>

  <!-- ── PREFÁCIO ── -->
  <section class="preface" id="prefacio">
    <div class="label">PREFÁCIO</div>
    <div id="preface-content"></div>
    <div class="preface__divider"></div>
  </section>

  <!-- ── CAPÍTULOS ── -->
  <main class="container" id="chapters-container"></main>

  <!-- ── FINAL ── -->
  <footer class="final">
    <div class="final__ornament">✦ ✝ ✦</div>
    <p id="final-texto"></p>
    <br>
    <cite id="final-fonte"></cite>
  </footer>

  <!-- ── BOTÃO VOLTAR AO TOPO ── -->
  <button class="back-top" id="back-top" title="Voltar ao topo">↑</button>

  <!-- ── DADOS + APP ── -->
  <script src="conteudo.js"></script>
  <script src="app.js"></script>

</body>
</html>
